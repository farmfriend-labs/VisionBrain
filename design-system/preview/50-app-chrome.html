<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* ─────────────────────────────────────────────────────────────────
   FarmFriend Aerial Intelligence — Design Tokens
   A refined operator's terminal. Monospace UI, restrained warm accent,
   hairline borders, no glow. Pair mono with serif for field reports.
   ───────────────────────────────────────────────────────────────── */

/* JetBrains Mono — the interface voice.  Spectral — field reports. */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap');

:root {
  /* ── Canvas & surfaces ──────────────────────────────────────── */
  --canvas:        #0e100d;   /* warm near-black, slight olive cast */
  --surface-1:     #15181410; /* very subtle layer */
  --surface-2:     #181b16;   /* panels */
  --surface-3:     #1f221c;   /* lifted */
  --surface-4:     #262a23;   /* hover */

  /* ── Paper (for field reports, slides, print surfaces) ──────── */
  --paper:         #f3eee2;   /* warm bone */
  --paper-2:       #ebe5d4;   /* tinted band */
  --paper-ink:     #1a1c18;
  --paper-ink-2:   #4a4d44;
  --paper-rule:    #c8c1ac;

  /* ── Hairlines ──────────────────────────────────────────────── */
  --rule:          #292d25;   /* default 1px border on dark */
  --rule-strong:   #3a3e34;
  --rule-soft:     #1f221c;

  /* ── Text (ink scale on dark) ───────────────────────────────── */
  --ink-1:         #ebe5d2;   /* primary, warm bone */
  --ink-2:         #b8b29f;   /* secondary */
  --ink-3:         #807a68;   /* tertiary, captions */
  --ink-4:         #555044;   /* labels, disabled */
  --ink-5:         #383428;   /* dimmest, scaffolding */

  /* ── Accent — wheat / signal amber ──────────────────────────── */
  /* Use sparingly: cursors, active state, key data, one focal point per view. */
  --accent:        #d4b572;
  --accent-deep:   #a48343;
  --accent-low:    #6f562c;
  --accent-wash:   rgba(212, 181, 114, 0.08);

  /* ── Semantic — muted, NEVER neon ───────────────────────────── */
  --ok:            #8fa97a;   /* sage */
  --ok-low:        #4f6443;
  --warn:          #c89766;   /* clay */
  --warn-low:      #7e5a36;
  --err:           #b66150;   /* rust */
  --err-low:       #6e3328;
  --info:          #7e94a6;   /* slate */
  --info-low:      #4a5a68;

  /* ── Type stack ─────────────────────────────────────────────── */
  --font-mono:     'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-serif:    'Spectral', 'Source Serif Pro', Georgia, serif;

  /* ── Type scale (12 → 32) ───────────────────────────────────── */
  --t-9:    9px;     /* micro labels, eyebrow caps */
  --t-10:   10px;    /* labels */
  --t-11:   11px;    /* secondary UI */
  --t-12:   12px;    /* compact UI */
  --t-13:   13px;    /* base UI */
  --t-15:   15px;    /* body */
  --t-18:   18px;    /* sub-heading */
  --t-22:   22px;    /* heading */
  --t-28:   28px;    /* display */
  --t-40:   40px;    /* hero */

  /* ── Letter-spacing — tracking for caps & data ──────────────── */
  --track-tight:   -0.01em;
  --track-norm:     0;
  --track-label:    0.08em;
  --track-caps:     0.16em;
  --track-wide:     0.22em;

  /* ── Line heights ───────────────────────────────────────────── */
  --lh-tight:      1.1;
  --lh-snug:       1.35;
  --lh-prose:      1.6;
  --lh-report:     1.7;

  /* ── Spacing scale (4-based) ────────────────────────────────── */
  --s-1:  4px;
  --s-2:  8px;
  --s-3:  12px;
  --s-4:  16px;
  --s-5:  20px;
  --s-6:  24px;
  --s-8:  32px;
  --s-10: 40px;
  --s-12: 48px;
  --s-16: 64px;
  --s-20: 80px;

  /* ── Radii — generally none.  Square or 2px only. ───────────── */
  --r-0:  0;
  --r-1:  2px;        /* default for inputs / chips */
  --r-2:  4px;        /* cards */
  --r-full: 999px;    /* rare — status dots */

  /* ── Elevation — none.  Use hairlines, not shadows. ─────────── */
  /* If forced to use shadow, prefer inset 1px lines instead.    */
  --shadow-inset:   inset 0 0 0 1px var(--rule);
  --shadow-soft:    0 1px 0 var(--rule-soft);

  /* ── Motion — quiet, no bounces ─────────────────────────────── */
  --ease:          cubic-bezier(0.2, 0, 0, 1);
  --dur-fast:      120ms;
  --dur-base:      180ms;
  --dur-slow:      280ms;
}

/* ─────────────────────────────────────────────────────────────────
   Semantic role variables (paint these onto your components)
   ───────────────────────────────────────────────────────────────── */
:root {
  --bg:            var(--canvas);
  --bg-elev:       var(--surface-2);
  --bg-hover:      var(--surface-4);

  --fg:            var(--ink-1);
  --fg-muted:      var(--ink-2);
  --fg-dim:        var(--ink-3);
  --fg-label:      var(--ink-4);

  --border:        var(--rule);
  --border-strong: var(--rule-strong);

  --link:          var(--accent);
  --link-hover:    var(--ink-1);
  --focus-ring:    var(--accent);

  --status-ready:  var(--ok);
  --status-warn:   var(--warn);
  --status-err:    var(--err);
  --status-info:   var(--info);
}

/* ─────────────────────────────────────────────────────────────────
   Base reset + type
   ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: var(--t-13);
  font-weight: 400;
  line-height: var(--lh-snug);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'ss02', 'cv02', 'cv03', 'zero';
  text-rendering: optimizeLegibility;
}

/* ─────────────────────────────────────────────────────────────────
   Semantic type roles — apply via class, not by default tag.
   The interface speaks in mono. Serif is reserved for editorial.
   ───────────────────────────────────────────────────────────────── */

/* Display + headings (mono, refined) */
.t-hero {
  font-family: var(--font-mono);
  font-size: var(--t-40);
  font-weight: 500;
  letter-spacing: var(--track-tight);
  line-height: var(--lh-tight);
}
.t-display {
  font-family: var(--font-mono);
  font-size: var(--t-28);
  font-weight: 500;
  letter-spacing: var(--track-tight);
  line-height: var(--lh-tight);
}
.t-h1 {
  font-family: var(--font-mono);
  font-size: var(--t-22);
  font-weight: 500;
  letter-spacing: 0;
  line-height: var(--lh-tight);
}
.t-h2 {
  font-family: var(--font-mono);
  font-size: var(--t-18);
  font-weight: 500;
  letter-spacing: 0;
  line-height: var(--lh-snug);
}
.t-h3 {
  font-family: var(--font-mono);
  font-size: var(--t-15);
  font-weight: 500;
  letter-spacing: 0;
  line-height: var(--lh-snug);
}

/* Body — interface */
.t-body {
  font-family: var(--font-mono);
  font-size: var(--t-13);
  font-weight: 400;
  line-height: var(--lh-snug);
}
.t-body-sm {
  font-family: var(--font-mono);
  font-size: var(--t-12);
  font-weight: 400;
  line-height: var(--lh-snug);
}

/* Data — tabular, fixed width, slight weight bump */
.t-data {
  font-family: var(--font-mono);
  font-size: var(--t-13);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}
.t-data-lg {
  font-family: var(--font-mono);
  font-size: var(--t-22);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: var(--track-tight);
}

/* Labels & eyebrows — small caps, wide tracking */
.t-label {
  font-family: var(--font-mono);
  font-size: var(--t-10);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: var(--track-caps);
  color: var(--fg-label);
}
.t-eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-9);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: var(--track-wide);
  color: var(--fg-dim);
}

/* Caption */
.t-caption {
  font-family: var(--font-mono);
  font-size: var(--t-11);
  font-weight: 400;
  color: var(--fg-dim);
}

/* Editorial — long-form report content (serif) */
.t-report {
  font-family: var(--font-serif);
  font-size: var(--t-15);
  font-weight: 400;
  line-height: var(--lh-report);
  color: var(--fg);
}
.t-report-display {
  font-family: var(--font-serif);
  font-size: var(--t-28);
  font-weight: 500;
  font-style: italic;
  line-height: var(--lh-tight);
  letter-spacing: var(--track-tight);
}

/* Code (subtle distinction inside reports) */
.t-code {
  font-family: var(--font-mono);
  font-size: 0.92em;
  font-weight: 400;
  background: var(--surface-3);
  padding: 0 4px;
  border-radius: var(--r-1);
}

/* ─────────────────────────────────────────────────────────────────
   Selection + focus
   ───────────────────────────────────────────────────────────────── */
::selection { background: var(--accent-low); color: var(--ink-1); }

:focus-visible {
  outline: 1px solid var(--focus-ring);
  outline-offset: 2px;
}

/* ─────────────────────────────────────────────────────────────────
   Scrollbar — hairline only
   ───────────────────────────────────────────────────────────────── */
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--rule-strong);
  border-radius: 0;
}
*::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

/* Preview card frame — used by every preview/*.html card.
   Keep frames identical so the Design System tab is consistent. */
html, body {
  background: var(--canvas);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

.card {
  width: 700px;
  padding: 18px 22px;
  box-sizing: border-box;
  font-family: var(--font-mono);
  color: var(--ink-1);
  background: var(--canvas);
}

/* a subtle dot grid for "operator surface" specimens (off by default) */
.card.tooled::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(212,181,114,.04) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
}

.card .row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.card .col {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.card .grid {
  display: grid;
  gap: 0;
}

.swatch {
  height: 64px;
  border: 1px solid var(--rule);
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 8px 10px;
  overflow: hidden;
}
.swatch .name {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-1);
  mix-blend-mode: difference;
  opacity: .85;
}
.swatch .hex {
  font-size: 10px;
  color: var(--ink-1);
  mix-blend-mode: difference;
  opacity: .65;
  font-variant-numeric: tabular-nums;
}

.eyebrow {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--ink-3);
}
.label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--ink-4);
  font-weight: 500;
}

.hr-soft { height: 1px; background: var(--rule); margin: 14px 0; }

.bracketed {
  position: relative;
  padding: 14px;
  border: 0;
}
.bracketed::before, .bracketed::after,
.bracketed > .br-tr, .bracketed > .br-bl {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  border-color: var(--ink-3);
}
.bracketed::before { top: 0; left: 0; border-top: 1.5px solid; border-left: 1.5px solid; }
.bracketed::after  { bottom: 0; right: 0; border-bottom: 1.5px solid; border-right: 1.5px solid; }
.bracketed > .br-tr { top: 0; right: 0; border-top: 1.5px solid var(--ink-3); border-right: 1.5px solid var(--ink-3); }
.bracketed > .br-bl { bottom: 0; left: 0; border-bottom: 1.5px solid var(--ink-3); border-left: 1.5px solid var(--ink-3); }

</style></head>
<body>
<div class="card" style="padding:0">
  <!-- header bar -->
  <div style="height:48px;background:rgba(14,16,13,.94);border-bottom:1px solid var(--rule);display:flex;align-items:center;padding:0 16px;gap:24px;backdrop-filter:blur(8px)">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="20" height="22" viewBox="0 0 52 60" fill="none">
        <path d="M26 1.5 L50 14.5 L50 44.5 L26 58.5 L2 44.5 L2 14.5 Z" stroke="#d4b572" stroke-width="1.6" fill="none"/>
        <path d="M26 13 L38 19.5 L38 33.5 L26 40 L14 33.5 L14 19.5 Z" stroke="#d4b572" stroke-width="1.2" fill="none" opacity="0.55"/>
      </svg>
      <span style="font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-1)">aerial intel</span>
      <span style="font-family:var(--font-mono);font-size:8.5px;letter-spacing:.18em;color:var(--ink-4);align-self:end;padding-bottom:2px">v2 · gcs</span>
    </div>
    <nav style="display:flex;gap:0;flex:1">
      <button style="font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:6px 14px;background:none;border:none;color:var(--accent);cursor:pointer;position:relative">analyze<span style="position:absolute;bottom:-2px;left:14px;right:14px;height:1.5px;background:var(--accent)"></span></button>
      <button style="font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding:6px 14px;background:none;border:none;color:var(--ink-3);cursor:pointer">detect</button>
      <button style="font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding:6px 14px;background:none;border:none;color:var(--ink-3);cursor:pointer">segment</button>
      <button style="font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding:6px 14px;background:none;border:none;color:var(--ink-3);cursor:pointer">track</button>
      <button style="font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding:6px 14px;background:none;border:none;color:var(--ink-3);cursor:pointer">ocr</button>
    </nav>
    <div style="display:flex;align-items:center;gap:8px;padding-left:14px;border-left:1px solid var(--rule)">
      <span style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></span>
      <span style="font-family:var(--font-mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)">all models ready</span>
    </div>
  </div>
  <!-- config bar -->
  <div style="height:54px;background:rgba(18,20,16,.96);border-top:1px solid var(--rule);display:flex;align-items:center;padding:0 16px;gap:14px">
    <div style="display:flex;flex-direction:column;gap:2px;flex:1">
      <label style="font-family:var(--font-mono);font-size:8px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4)">query</label>
      <input value="cattle in the pasture" style="font-family:var(--font-mono);font-size:11px;background:var(--surface-3);border:1px solid var(--rule);color:var(--ink-1);padding:3px 8px;height:22px;border-radius:2px">
    </div>
    <div style="display:flex;flex-direction:column;gap:2px;width:80px">
      <label style="font-family:var(--font-mono);font-size:8px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4)">thresh</label>
      <div style="display:flex;align-items:center;gap:6px;height:22px"><input type="range" value="15" style="flex:1;accent-color:var(--accent);height:2px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--accent);font-variant-numeric:tabular-nums">0.15</span></div>
    </div>
    <div style="width:1px;height:30px;background:var(--rule)"></div>
    <button style="font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:0 16px;height:30px;background:rgba(212,181,114,.07);border:1px solid var(--accent);color:var(--accent);cursor:pointer;border-radius:2px">▶ launch</button>
  </div>
</div>
</body></html>
