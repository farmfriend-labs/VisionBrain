/* ─────────────────────────────────────────────────────────────────
   FarmFriend Aerial Intelligence — Design Tokens
   A refined operator's terminal. Monospace UI, restrained warm accent,
   hairline borders, no glow. Pair mono with serif for field reports.
   ───────────────────────────────────────────────────────────────── */

/* JetBrains Mono — the interface voice.  Spectral — field reports. */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap');

:root {
  /* ── Canvas & surfaces ──────────────────────────────────────── */
  --canvas:        #0e100d;   /* warm near-black, slight olive cast */
  --surface-1:     #15181410; /* very subtle layer */
  --surface-2:     #181b16;   /* panels */
  --surface-3:     #1f221c;   /* lifted */
  --surface-4:     #262a23;   /* hover */

  /* ── Paper (for field reports, slides, print surfaces) ──────── */
  --paper:         #f3eee2;   /* warm bone */
  --paper-2:       #ebe5d4;   /* tinted band */
  --paper-ink:     #1a1c18;
  --paper-ink-2:   #4a4d44;
  --paper-rule:    #c8c1ac;

  /* ── Hairlines ──────────────────────────────────────────────── */
  --rule:          #292d25;   /* default 1px border on dark */
  --rule-strong:   #3a3e34;
  --rule-soft:     #1f221c;

  /* ── Text (ink scale on dark) ───────────────────────────────── */
  --ink-1:         #ebe5d2;   /* primary, warm bone */
  --ink-2:         #b8b29f;   /* secondary */
  --ink-3:         #807a68;   /* tertiary, captions */
  --ink-4:         #555044;   /* labels, disabled */
  --ink-5:         #383428;   /* dimmest, scaffolding */

  /* ── Brand — FarmFriend logo colors ─────────────────────────── */
  --ff-teal:       #42a4ac;
  --ff-teal-deep:  #2e7a80;
  --ff-green:      #42b67e;
  --ff-green-deep: #2e8458;

  /* ── Accent — wheat / signal amber ──────────────────────────── */
  /* Use sparingly: cursors, active state, key data, one focal point per view. */
  --accent:        #d4b572;
  --accent-deep:   #a48343;
  --accent-low:    #6f562c;
  --accent-wash:   rgba(212, 181, 114, 0.08);

  /* ── Semantic — muted, NEVER neon ───────────────────────────── */
  --ok:            #8fa97a;   /* sage */
  --ok-low:        #4f6443;
  --warn:          #c89766;   /* clay */
  --warn-low:      #7e5a36;
  --err:           #b66150;   /* rust */
  --err-low:       #6e3328;
  --info:          #7e94a6;   /* slate */
  --info-low:      #4a5a68;

  /* ── Type stack ─────────────────────────────────────────────── */
  --font-mono:     'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-serif:    'Spectral', 'Source Serif Pro', Georgia, serif;

  /* ── Type scale (12 → 32) ───────────────────────────────────── */
  --t-9:    9px;     /* micro labels, eyebrow caps */
  --t-10:   10px;    /* labels */
  --t-11:   11px;    /* secondary UI */
  --t-12:   12px;    /* compact UI */
  --t-13:   13px;    /* base UI */
  --t-15:   15px;    /* body */
  --t-18:   18px;    /* sub-heading */
  --t-22:   22px;    /* heading */
  --t-28:   28px;    /* display */
  --t-40:   40px;    /* hero */

  /* ── Letter-spacing — tracking for caps & data ──────────────── */
  --track-tight:   -0.01em;
  --track-norm:     0;
  --track-label:    0.08em;
  --track-caps:     0.16em;
  --track-wide:     0.22em;

  /* ── Line heights ───────────────────────────────────────────── */
  --lh-tight:      1.1;
  --lh-snug:       1.35;
  --lh-prose:      1.6;
  --lh-report:     1.7;

  /* ── Spacing scale (4-based) ────────────────────────────────── */
  --s-1:  4px;
  --s-2:  8px;
  --s-3:  12px;
  --s-4:  16px;
  --s-5:  20px;
  --s-6:  24px;
  --s-8:  32px;
  --s-10: 40px;
  --s-12: 48px;
  --s-16: 64px;
  --s-20: 80px;

  /* ── Radii — generally none.  Square or 2px only. ───────────── */
  --r-0:  0;
  --r-1:  2px;        /* default for inputs / chips */
  --r-2:  4px;        /* cards */
  --r-full: 999px;    /* rare — status dots */

  /* ── Elevation — none.  Use hairlines, not shadows. ─────────── */
  /* If forced to use shadow, prefer inset 1px lines instead.    */
  --shadow-inset:   inset 0 0 0 1px var(--rule);
  --shadow-soft:    0 1px 0 var(--rule-soft);

  /* ── Motion — quiet, no bounces ─────────────────────────────── */
  --ease:          cubic-bezier(0.2, 0, 0, 1);
  --dur-fast:      120ms;
  --dur-base:      180ms;
  --dur-slow:      280ms;
}

/* ─────────────────────────────────────────────────────────────────
   Semantic role variables (paint these onto your components)
   ───────────────────────────────────────────────────────────────── */
:root {
  --bg:            var(--canvas);
  --bg-elev:       var(--surface-2);
  --bg-hover:      var(--surface-4);

  --fg:            var(--ink-1);
  --fg-muted:      var(--ink-2);
  --fg-dim:        var(--ink-3);
  --fg-label:      var(--ink-4);

  --border:        var(--rule);
  --border-strong: var(--rule-strong);

  --link:          var(--accent);
  --link-hover:    var(--ink-1);
  --focus-ring:    var(--accent);

  --status-ready:  var(--ok);
  --status-warn:   var(--warn);
  --status-err:    var(--err);
  --status-info:   var(--info);
}

/* ─────────────────────────────────────────────────────────────────
   Base reset + type
   ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: var(--t-13);
  font-weight: 400;
  line-height: var(--lh-snug);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'ss02', 'cv02', 'cv03', 'zero';
  text-rendering: optimizeLegibility;
}

/* ─────────────────────────────────────────────────────────────────
   Semantic type roles — apply via class, not by default tag.
   The interface speaks in mono. Serif is reserved for editorial.
   ───────────────────────────────────────────────────────────────── */

/* Display + headings (mono, refined) */
.t-hero {
  font-family: var(--font-mono);
  font-size: var(--t-40);
  font-weight: 500;
  letter-spacing: var(--track-tight);
  line-height: var(--lh-tight);
}
.t-display {
  font-family: var(--font-mono);
  font-size: var(--t-28);
  font-weight: 500;
  letter-spacing: var(--track-tight);
  line-height: var(--lh-tight);
}
.t-h1 {
  font-family: var(--font-mono);
  font-size: var(--t-22);
  font-weight: 500;
  letter-spacing: 0;
  line-height: var(--lh-tight);
}
.t-h2 {
  font-family: var(--font-mono);
  font-size: var(--t-18);
  font-weight: 500;
  letter-spacing: 0;
  line-height: var(--lh-snug);
}
.t-h3 {
  font-family: var(--font-mono);
  font-size: var(--t-15);
  font-weight: 500;
  letter-spacing: 0;
  line-height: var(--lh-snug);
}

/* Body — interface */
.t-body {
  font-family: var(--font-mono);
  font-size: var(--t-13);
  font-weight: 400;
  line-height: var(--lh-snug);
}
.t-body-sm {
  font-family: var(--font-mono);
  font-size: var(--t-12);
  font-weight: 400;
  line-height: var(--lh-snug);
}

/* Data — tabular, fixed width, slight weight bump */
.t-data {
  font-family: var(--font-mono);
  font-size: var(--t-13);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}
.t-data-lg {
  font-family: var(--font-mono);
  font-size: var(--t-22);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: var(--track-tight);
}

/* Labels & eyebrows — small caps, wide tracking */
.t-label {
  font-family: var(--font-mono);
  font-size: var(--t-10);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: var(--track-caps);
  color: var(--fg-label);
}
.t-eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-9);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: var(--track-wide);
  color: var(--fg-dim);
}

/* Caption */
.t-caption {
  font-family: var(--font-mono);
  font-size: var(--t-11);
  font-weight: 400;
  color: var(--fg-dim);
}

/* Editorial — long-form report content (serif) */
.t-report {
  font-family: var(--font-serif);
  font-size: var(--t-15);
  font-weight: 400;
  line-height: var(--lh-report);
  color: var(--fg);
}
.t-report-display {
  font-family: var(--font-serif);
  font-size: var(--t-28);
  font-weight: 500;
  font-style: italic;
  line-height: var(--lh-tight);
  letter-spacing: var(--track-tight);
}

/* Code (subtle distinction inside reports) */
.t-code {
  font-family: var(--font-mono);
  font-size: 0.92em;
  font-weight: 400;
  background: var(--surface-3);
  padding: 0 4px;
  border-radius: var(--r-1);
}

/* ─────────────────────────────────────────────────────────────────
   Selection + focus
   ───────────────────────────────────────────────────────────────── */
::selection { background: var(--accent-low); color: var(--ink-1); }

:focus-visible {
  outline: 1px solid var(--focus-ring);
  outline-offset: 2px;
}

/* ─────────────────────────────────────────────────────────────────
   Scrollbar — hairline only
   ───────────────────────────────────────────────────────────────── */
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--rule-strong);
  border-radius: 0;
}

// ─── Eyebrow label (small caps, wide tracking) ───────────────────
function Eyebrow({ children, color, style }) {
  return (
    <div style={{
      fontFamily: "var(--font-mono)",
      fontSize: 9,
      fontWeight: 600,
      letterSpacing: "0.22em",
      textTransform: "uppercase",
      color: color || "var(--ink-3)",
      ...style,
    }}>{children}</div>
  );
}

// ─── Status dot ──────────────────────────────────────────────────
function Dot({ status = "ok", pulse = false, size = 7 }) {
  const color = {
    ok: "var(--ok)",
    warn: "var(--warn)",
    err: "var(--err)",
    info: "var(--info)",
    idle: "var(--ink-4)",
  }[status];
  return (
    <span style={{
      width: size, height: size, borderRadius: "50%",
      background: color, flexShrink: 0,
      animation: pulse ? "ai-pulse 2.5s ease-in-out infinite" : undefined,
    }} />
  );
}

// ─── Status pill (chip with dot + label) ─────────────────────────
function StatusPill({ status = "ok", children }) {
  const c = {
    ok:   { fg: "var(--ok)",   bg: "rgba(143,169,122,.07)", bd: "rgba(143,169,122,.4)" },
    warn: { fg: "var(--warn)", bg: "rgba(200,151,102,.07)", bd: "rgba(200,151,102,.4)" },
    err:  { fg: "var(--err)",  bg: "rgba(182,97,80,.07)",   bd: "rgba(182,97,80,.4)" },
    idle: { fg: "var(--ink-3)", bg: "transparent",          bd: "var(--rule-strong)" },
  }[status];
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      padding: "2px 7px",
      border: `1px solid ${c.bd}`,
      background: c.bg,
      borderRadius: 2,
      fontFamily: "var(--font-mono)",
      fontSize: 8,
      fontWeight: 600,
      letterSpacing: "0.18em",
      textTransform: "uppercase",
      color: c.fg,
    }}>{children}</span>
  );
}

// ─── Button ──────────────────────────────────────────────────────
function Button({ variant = "secondary", state = "default", children, onClick, style, ...rest }) {
  const base = {
    fontFamily: "var(--font-mono)",

      letterSpacing: "0.18em",

    ghost: {

      border: "1px solid var(--rule)",
      color: "var(--ink-3)",
    },
  };
  const disabled = state === "disabled";
  return (
    <button
      onClick={disabled ? undefined : onClick}
      disabled={disabled}
      style={{
        ...variants[variant],
        ...(disabled ? { opacity: 0.4, cursor: "not-allowed" } : null),
        ...style,
      }}
      {...rest}
    >{children}</button>
  );
}

// ─── Label (form-style small cap label) ──────────────────────────

    </div>
  );
}

function Pipeline({ stage }) {

    <div style={{
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      padding: "14px 36px 16px",
      borderTop: "1px solid var(--rule)",

      flexShrink: 0,
    }}>
      <PipelineStage name="sam"    sub="3.1"            state={s(1)} />
      <PipelineLine active={stage >= 2} />
      <PipelineStage name="falcon" sub="perception"     state={s(2)} />
      <PipelineLine active={stage >= 3} />
      <PipelineStage name="gemma"  sub="4 · 26b"        state={s(3)} />
    </div>
  );
}
